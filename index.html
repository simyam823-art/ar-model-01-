<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>AR Model</title>

  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #eeeeee;
      font-family: sans-serif;
      overflow: hidden;
    }

    model-viewer {
      width: 100vw;
      height: 100vh;
      background: #eeeeee;
    }

    .ar-button {
      position: absolute;
      top: 20px;
      right: 20px;
      padding: 12px 20px;
      border: none;
      border-radius: 999px;
      background: #ffffff;
      color: #111111;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.04em;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
      cursor: pointer;
    }

    .ar-button:active {
      transform: scale(0.96);
    }

    .ar-button[slot="ar-button"] {
      display: block;
    }

    model-viewer:not(:defined) {
      visibility: hidden;
    }
  </style>
</head>

<body>
  <model-viewer
    src="./model.glb"
    ios-src="./model.usdz"
    ar
    ar-modes="quick-look scene-viewer webxr"
    camera-controls
    auto-rotate
    shadow-intensity="1"
    exposure="1"
    alt="AR 3D model">

    <button slot="ar-button" class="ar-button">
      ARで見る
    </button>

  </model-viewer>
</body>
</html>
